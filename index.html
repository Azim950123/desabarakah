<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Homestay Desa Barakah: RM200 semalaman, 3 bilik berhawa dingin, laman yang luas. Tempah terus melalui WhatsApp.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Homestay Desa Barakah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centred column. Home view = photo hero, key facts, photo gallery, WhatsApp; Booking view = 3-step wizard. */
:root{
  --bg:#f5f7f5; --surface:#ffffff; --fg:#1a2420; --muted:#56635c; --line:#dbe2dd; --booked:#eceeed;
  --danger:#b3261e; --danger-soft:#fbeceb; --on-acc:#ffffff;
  --acc:#2b774a; --soft:#e5f1e9; --wa:#1a8a4a;
  --fd:"Lora", Georgia, serif; --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201d; --fg:#e7eee9; --muted:#a2b0a8; --line:#2b3530; --booked:#232b27;
  --danger:#f2b8b5; --danger-soft:#3a1f1e; --on-acc:#0c1310; --acc:#6fc796; --soft:#1c3227; --wa:#5fd08f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201d; --fg:#e7eee9; --muted:#a2b0a8; --line:#2b3530; --booked:#232b27;
  --danger:#f2b8b5; --danger-soft:#3a1f1e; --on-acc:#0c1310; --acc:#6fc796; --soft:#1c3227; --wa:#5fd08f;
  color-scheme:dark }
body{ background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:17px; line-height:1.55 }
*{box-sizing:border-box}
.wrap{ max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 48px; display:flex; flex-direction:column; gap:20px }
h1,h2,h3{ font-family:var(--fd); text-wrap:balance; margin:0; line-height:1.2; font-weight:600 }
button,input,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--acc); outline-offset:2px }
a{ color:inherit }

.top{ display:flex; align-items:center; gap:12px }
.mark{ width:44px; height:44px; border-radius:var(--r); background:var(--acc); color:var(--on-acc); display:grid; place-items:center; flex:none }
.top b{ font-family:var(--fd); font-size:1.25rem; font-weight:600; line-height:1.2 }
.top p{ margin:0; color:var(--muted); font-size:.9rem }
.top .home-link{ margin-left:auto }

/* hero */
.hero{ position:relative; border-radius:var(--r); overflow:hidden; background:var(--booked) }
.hero img{ display:block; width:100%; aspect-ratio:4/3; object-fit:cover }
@media (min-width:600px){ .hero img{ aspect-ratio:16/10 } }
.hero-cap{ position:absolute; left:0; right:0; bottom:0; padding:48px 20px 18px; background:linear-gradient(to top, rgba(8,20,14,.82), rgba(8,20,14,0)); color:#fff; display:flex; flex-direction:column; gap:4px }
.hero-cap h1{ font-size:clamp(1.7rem, 6vw, 2.4rem); color:#fff }
.hero-cap p{ margin:0; font-size:1rem; opacity:.92 }

.price-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap }
.price{ display:flex; flex-direction:column }
.price small{ font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:800 }
.price b{ font-family:var(--fd); font-size:2.3rem; color:var(--acc); font-weight:700; line-height:1.1 }
.price b span{ font-family:var(--f-body); font-size:1rem; color:var(--muted); font-weight:600 }

.facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:0; padding:0; list-style:none }
.facts li{ background:var(--soft); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:6px; min-width:0 }
.facts svg{ color:var(--acc) }
.facts b{ font-size:1.02rem; line-height:1.3 }
.facts span{ font-size:.88rem; color:var(--muted); line-height:1.35 }
@media (max-width:520px){ .facts{ grid-template-columns:1fr } .facts li{ flex-direction:row; align-items:center; gap:12px } .facts li div{ display:flex; flex-direction:column } }

.gallery{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px }
.gallery figure{ margin:0; display:flex; flex-direction:column; gap:6px; min-width:0 }
.gallery img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; display:block; background:var(--booked) }
.gallery figcaption{ font-size:.88rem; color:var(--muted); font-weight:700 }
@media (max-width:520px){ .gallery{ grid-template-columns:1fr 1fr } .gallery figure:first-child{ grid-column:1 / -1 } .gallery figure:first-child img{ aspect-ratio:4/3 } }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:24px; display:flex; flex-direction:column; gap:20px; min-width:0 }
@media (max-width:520px){ .card{ padding:18px } }
.sec-title{ font-size:1.35rem }

.btn{ min-height:56px; padding:0 22px; border-radius:var(--r); border:1.5px solid transparent; font-weight:800; font-size:1.08rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; text-align:center }
.btn.primary{ background:var(--acc); color:var(--on-acc) }
.btn.wa{ background:var(--surface); color:var(--wa); border-color:var(--wa) }
.btn.wa-solid{ background:var(--wa); color:var(--on-acc) }
.btn.ghost{ background:transparent; border-color:var(--line) }
.btn.full{ width:100% }
.small-btn{ min-height:40px; padding:0 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; cursor:pointer; font-size:.92rem }

.contact{ display:flex; flex-direction:column; gap:12px }
.who{ display:flex; align-items:center; gap:14px }
.avatar{ width:52px; height:52px; border-radius:50%; background:var(--soft); color:var(--acc); display:grid; place-items:center; font-weight:800; font-family:var(--fd); font-size:1.3rem; flex:none }
.who b{ font-size:1.1rem; display:block }
.who span{ color:var(--muted); font-variant-numeric:tabular-nums }
.who .small-btn{ margin-left:auto }

.cta-bar{ display:flex; flex-direction:column; gap:10px }
/* home layout: one column on phone, content + sticky booking panel on wide screens */
#app{ display:flex; flex-direction:column; gap:20px; min-width:0 }
.facts li div{ display:flex; flex-direction:column; gap:2px; min-width:0 }
.who span{ white-space:nowrap }
.mbar > div{ white-space:nowrap }
.mbar .btn{ white-space:nowrap; padding:0 18px; font-size:1rem }
.home{ display:grid; gap:20px; grid-template-columns:minmax(0,1fr) }
.side,.col{ display:flex; flex-direction:column; gap:20px; min-width:0 }
.muted-s{ margin:-8px 0 0; color:var(--muted); font-size:.92rem }
.book{ gap:16px }
.only-wide{ display:none }
.narrow{ max-width:680px; width:100%; margin-inline:auto }
.mbar{ position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(0,0,0,.08) }
.mbar b{ font-family:var(--fd); font-size:1.5rem; color:var(--acc) }
.mbar span{ color:var(--muted); font-size:.9rem }
.mbar .btn{ min-height:50px }
@media (max-width:899px){ body.home-view .wrap{ padding-block-end:112px } }
@media (min-width:900px){
  .wrap{ padding-block:28px 56px }
  .home{ grid-template-columns:minmax(0,1fr) 340px; align-items:start }
  .side{ grid-column:2; grid-row:1; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 20px) }
  .col{ grid-column:1; grid-row:1 }
  .only-wide{ display:block } .only-narrow{ display:none }
  .mbar{ display:none }
  .hero img{ aspect-ratio:21/9 }
}
.cta-bar.two{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)) }

/* wizard */
.progress{ display:flex; flex-direction:column; gap:8px }
.progress span{ font-size:.9rem; color:var(--muted); font-weight:700 }
.bar{ height:8px; background:var(--booked); border-radius:99px; overflow:hidden }
.bar i{ display:block; height:100%; background:var(--acc); border-radius:99px; transition:width .3s }
.steptitle{ font-size:1.7rem }
.lead{ margin:-10px 0 0; color:var(--muted) }
.nav{ display:flex; gap:12px; justify-content:space-between; padding-top:4px; flex-wrap:wrap }
.nav .btn.primary,.nav .btn.wa-solid{ flex:1; min-width:200px; margin-left:auto }
.err{ background:var(--danger-soft); color:var(--danger); border-radius:10px; padding:12px 14px; font-weight:700; margin:0 }

.cal{ display:flex; flex-direction:column; gap:14px }
.cal-head{ display:flex; align-items:center; justify-content:space-between; gap:8px }
.cal-head strong{ font-size:1.15rem }
.round{ width:48px; height:48px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); font-size:1.4rem; cursor:pointer; flex:none }
.round:disabled{ opacity:.3; cursor:default }
.grid7{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px }
.dow{ text-align:center; font-size:.78rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding-bottom:4px }
.day{ aspect-ratio:1; max-width:100%; border:0; border-radius:10px; background:transparent; font-weight:700; font-size:1.02rem; cursor:pointer; font-variant-numeric:tabular-nums; position:relative }
.day:hover:not(:disabled){ background:var(--soft) }
.day:disabled{ cursor:not-allowed; color:var(--muted); opacity:.5 }
.day.booked{ background:var(--booked); text-decoration:line-through; opacity:1; color:var(--muted) }
.day.today::after{ content:""; position:absolute; left:50%; bottom:6px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--acc) }
.day.range{ background:var(--soft); border-radius:0 }
.day.in,.day.out{ background:var(--acc); color:var(--on-acc); opacity:1; text-decoration:none }
.legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:.86rem; color:var(--muted) }
.legend i{ display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px }
.picked{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.pick{ border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; min-width:0 }
.pick small{ font-size:.78rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800 }
.pick b{ font-size:1rem } .pick.on{ border-color:var(--acc) }
.pick b.none{ color:var(--muted); font-weight:600 }
.hint{ margin:0; font-weight:700; color:var(--acc); font-size:1.02rem }

.field{ display:flex; flex-direction:column; gap:6px }
.field label{ font-weight:800 }
.field .help{ font-size:.86rem; color:var(--muted); margin:0 }
.field input,.field textarea{ min-height:54px; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--bg); width:100%; font-size:1.05rem }
.field input:focus,.field textarea:focus{ border-color:var(--acc); outline:none; box-shadow:0 0 0 3px var(--soft) }
.stepper{ display:flex; align-items:center; gap:16px }
.stepper output{ font-size:1.6rem; font-weight:800; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums }

.rows{ display:flex; flex-direction:column; margin:0 }
.rows div{ display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line) }
.rows dt{ color:var(--muted) } .rows dd{ margin:0; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; min-width:0; overflow-wrap:anywhere }
.total{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:1.2rem; font-weight:800 }
.total b{ font-family:var(--fd); font-size:1.7rem; color:var(--acc); font-weight:700 }
.note{ font-size:.92rem; color:var(--muted); margin:0; background:var(--bg); border-radius:10px; padding:12px 14px }

.done{ align-items:flex-start }
.tick{ width:64px; height:64px; border-radius:50%; background:var(--soft); color:var(--acc); display:grid; place-items:center }
.msg{ width:100%; white-space:pre-wrap; background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; font-size:.92rem; margin:0; overflow-wrap:anywhere }
.foot{ text-align:center; color:var(--muted); font-size:.85rem; margin:0 }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important } }
</style>

</head>

function phoneOk(p){return /^01\d{8,9}$/.test(p.replace(/\D/g,''))}
function check(step){
  if(step==='tarikh'&&(!S.in||!S.out)) return 'Sila pilih tarikh datang dan tarikh balik.';
  if(step==='maklumat'){ if(S.name.trim().length<3) return 'Sila tulis nama penuh anda.';
    if(!phoneOk(S.phone)) return 'Nombor telefon kurang tepat. Contoh yang betul: 012 345 6789.' }
  return '';
}
function bookingText(){
  const n=nights(S.in,S.out);
  return `Assalamualaikum Haji Berkuri, saya ingin menempah Homestay Desa Barakah.

Nama: ${S.name.trim()}
Telefon: ${S.phone.trim()}
Tarikh datang: ${fmt(S.in)}
Tarikh balik: ${fmt(S.out)}
Bilangan malam: ${n}
Bilangan tetamu: ${S.guests} orang
Anggaran harga: ${rm(PRICE*n)}`+(S.note.trim()?`\nPermintaan khas: ${S.note.trim()}`:'')+`

Mohon sahkan tarikh ini kosong. Terima kasih.`;
}

/* ---------- Views ---------- */
function vContact(title){
  return `<section class="card contact">
    <h2 class="sec-title">${title}</h2>
    <div class="who"><div class="avatar" aria-hidden="true">HB</div>
      <div><b>${OWNER}</b><span id="wa-num">${WA_SHOW}</span></div>
      <button class="small-btn" data-act="copy-num">Salin nombor</button></div>
    <a class="btn wa full" href="${WA_ASK}" target="_blank" rel="noopener">${ICON.wa} Tanya di WhatsApp</a>
  </section>`;
}
function vHome(){
  return `
  <div class="hero"><img src="${IMG.luar}" alt="Rumah Homestay Desa Barakah dari luar, dengan laman rumput yang luas dan wakaf">
    <div class="hero-cap"><h1>Homestay Desa Barakah</h1><p>Rumah kampung yang selesa untuk seluruh keluarga</p></div></div>

  <div class="home">
  <aside class="side">
    <section class="card book">
      <div class="price"><small>Harga</small><b>${rm(PRICE)} <span>/ semalaman</span></b></div>
      <p class="muted-s">Daftar masuk 2:00 ptg · Keluar 12:00 tgh</p>
      <button class="btn primary full" data-act="start">Tempah sekarang ›</button>
      <a class="btn wa full" href="${WA_ASK}" target="_blank" rel="noopener">${ICON.wa} Tanya dulu di WhatsApp</a>
    </section>
    <div class="only-wide">${vContact('Hubungi tuan rumah')}</div>
  </aside>
  <div class="col">
  <section class="card">
    <h2 class="sec-title">Kemudahan</h2>
    <ul class="facts">
      <li>${ICON.bed}<div><b>3 bilik tidur</b><span>Selesa untuk keluarga</span></div></li>
      <li>${ICON.cool}<div><b>Semua berhawa dingin</b><span>Aircond di setiap bilik</span></div></li>
      <li>${ICON.tree}<div><b>Laman yang luas</b><span>Ruang untuk kanak-kanak bermain</span></div></li>
    </ul>
  </section>

  <section class="card">
    <h2 class="sec-title">Lihat di dalam rumah</h2>
    <div class="gallery">
      <figure><img src="${IMG.bilik}" alt="Bilik tidur dengan katil queen" loading="lazy"><figcaption>Bilik tidur</figcaption></figure>
      <figure><img src="${IMG.tamu}" alt="Ruang tamu dengan set sofa" loading="lazy"><figcaption>Ruang tamu</figcaption></figure>
      <figure><img src="${IMG.dapur}" alt="Dapur dengan meja makan, peti sejuk dan mesin basuh" loading="lazy"><figcaption>Dapur & ruang makan</figcaption></figure>
    </div>
  </section>

  <section class="card">
    <h2 class="sec-title">Lokasi</h2>
    <div class="who"><div class="avatar" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div><b>Homestay Desa Barakah</b><span>Tekan butang di bawah untuk panduan arah</span></div></div>
    <div class="cta-bar two">
      <a class="btn primary" href="https://maps.app.goo.gl/tAJSurVtnG6Ld7VH8" target="_blank" rel="noopener">Buka Google Maps</a>
      <a class="btn ghost" href="https://waze.com/ul?ll=5.7625076,102.2490364&amp;navigate=yes" target="_blank" rel="noopener">Buka Waze</a>
    </div>
  </section>

  <div class="only-narrow">${vContact('Ada soalan? Hubungi tuan rumah')}</div>
  </div>
  </div>
  <div class="mbar"><div><b>${rm(PRICE)}</b> <span>/ semalaman</span></div><button class="btn primary" data-act="start">Tempah sekarang</button></div>`;
}
function vCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const isFirstMonth=iso(calMonth).slice(0,7)===TODAY.slice(0,7);
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div></div>';
  const choosingOut=S.in&&!S.out;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`,past=ds<TODAY,full=BOOKED.has(ds);
    const canOut=choosingOut&&ds>S.in&&!conflict(S.in,ds);
    const cls=['day'];if(full)cls.push('booked');if(ds===TODAY)cls.push('today');
    if(ds===S.in)cls.push('in');if(ds===S.out)cls.push('out');
    if(S.in&&S.out&&ds>S.in&&ds<S.out)cls.push('range');
    const dis=past||(full&&!canOut);
    cells+=`<button class="${cls.join(' ')}" data-act="day:${ds}" ${dis?'disabled':''} aria-label="${fmt(ds)}${full?', penuh':''}">${d}</button>`;
  }
  const n=S.in&&S.out?nights(S.in,S.out):0;
  const hint=!S.in?'Tekan tarikh anda mahu datang.':!S.out?'Bagus. Sekarang tekan tarikh anda mahu balik.':`${n} malam · ${rm(PRICE*n)}. Tekan tarikh lain jika mahu tukar.`;
  return `<div class="cal">
    <div class="picked">
      <div class="pick ${S.in?'on':''}"><small>Tarikh datang</small><b class="${S.in?'':'none'}">${S.in?fmtShort(S.in):'Belum pilih'}</b></div>
      <div class="pick ${S.out?'on':''}"><small>Tarikh balik</small><b class="${S.out?'':'none'}">${S.out?fmtShort(S.out):'Belum pilih'}</b></div>
    </div>
    <p class="hint">${hint}</p>
    <div class="cal-head">
      <button class="round" data-act="cal-prev" aria-label="Bulan sebelum" ${isFirstMonth?'disabled':''}>‹</button>
      <strong>${MONTHS[m]} ${y}</strong>
      <button class="round" data-act="cal-next" aria-label="Bulan seterusnya">›</button>
    </div>
    <div class="grid7">${cells}</div>
    <div class="legend"><span><i style="background:var(--acc)"></i>Pilihan anda</span><span><i style="background:var(--booked);border:1px solid var(--line)"></i>Sudah penuh</span><span><i style="background:var(--surface);border:1px solid var(--line)"></i>Kosong</span></div>
    ${S.calMsg?`<p class="err" role="alert">${S.calMsg}</p>`:''}
  </div>`;
}
function vInfo(){
  return `<div class="field"><label>Berapa orang?</label>
      <div class="stepper"><button class="round" data-act="g-minus" aria-label="Kurangkan" ${S.guests<=1?'disabled':''}>−</button>
      <output aria-live="polite">${S.guests}</output>
      <button class="round" data-act="g-plus" aria-label="Tambah" ${S.guests>=20?'disabled':''}>+</button></div>
      <p class="help">Termasuk kanak-kanak.</p></div>
    <div class="field"><label for="f-name">Nama penuh</label><input id="f-name" autocomplete="name" value="${esc(S.name)}" placeholder="Contoh: Siti Aminah binti Ahmad"></div>
    <div class="field"><label for="f-phone">Nombor telefon (WhatsApp)</label><input id="f-phone" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(S.phone)}" placeholder="Contoh: 012 345 6789"></div>
    <div class="field"><label for="f-note">Permintaan khas <span style="font-weight:400;color:var(--muted)">(tidak wajib)</span></label><textarea id="f-note" rows="3" placeholder="Contoh: Sampai lewat malam">${esc(S.note)}</textarea></div>`;
}
function vReview(){
  const n=nights(S.in,S.out);
  return `<dl class="rows">
    <div><dt>Datang</dt><dd>${fmt(S.in)}</dd></div>
    <div><dt>Balik</dt><dd>${fmt(S.out)}</dd></div>
    <div><dt>Tetamu</dt><dd>${S.guests} orang</dd></div>
    <div><dt>Nama</dt><dd>${esc(S.name)}</dd></div>
    <div><dt>Telefon</dt><dd>${esc(S.phone)}</dd></div>
    ${S.note.trim()?`<div><dt>Permintaan</dt><dd>${esc(S.note)}</dd></div>`:''}
    <div><dt>${rm(PRICE)} × ${n} malam</dt><dd>${rm(PRICE*n)}</dd></div>
  </dl>
  <div class="total"><span>Jumlah</span><b>${rm(PRICE*n)}</b></div>
  <p class="note">Bila tekan butang hijau, WhatsApp akan buka dengan maklumat tempahan yang sudah siap ditulis. Anda cuma perlu tekan <b>Hantar</b> di WhatsApp. ${OWNER} akan balas untuk sahkan tarikh dan cara bayaran.</p>`;
}
function vWizard(){
  const key=STEPS[S.step],last=S.step===STEPS.length-1;
  const [t,lead]=TITLE[key];
  const body=key==='tarikh'?vCalendar():key==='maklumat'?vInfo():vReview();
  return `<section class="card narrow">
    <div class="progress"><span>Langkah ${S.step+1} daripada ${STEPS.length}</span><div class="bar"><i style="width:${(S.step+1)/STEPS.length*100}%"></i></div></div>
    <h2 class="steptitle" id="stepTitle" tabindex="-1">${t}</h2>
    <p class="lead">${lead}</p>
    ${body}
    ${S.err?`<p class="err" role="alert">${S.err}</p>`:''}
    <div class="nav">
      <button class="btn ghost" data-act="back">‹ Kembali</button>
      ${last?`<a class="btn wa-solid" data-act="send" href="${waLink(bookingText())}" target="_blank" rel="noopener">${ICON.wa} Hantar tempahan di WhatsApp</a>`
            :'<button class="btn primary" data-act="next">Seterusnya ›</button>'}
    </div>
  </section>`;
}
function vDone(){
  return `<section class="card done narrow">
    <div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
    <h2 class="steptitle" id="stepTitle" tabindex="-1">Terima kasih, ${esc(S.name.trim().split(' ')[0])}!</h2>
    <p style="margin:0">Pastikan anda sudah tekan <b>Hantar</b> di WhatsApp. ${OWNER} akan balas untuk sahkan tarikh dan cara bayaran.</p>
    <p class="note" style="width:100%">WhatsApp tidak terbuka? Salin mesej di bawah dan hantar ke <b>${WA_SHOW}</b>.</p>
    <pre class="msg" id="msg">${esc(bookingText())}</pre>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="small-btn" data-act="copy-msg">Salin mesej</button>
      <button class="small-btn" data-act="copy-num">Salin nombor</button>
    </div>
    <button class="btn ghost" data-act="reset">Kembali ke halaman utama</button>
  </section>`;
}

/* ---------- Render & events ---------- */
const app=document.getElementById('app');
function render(focusTitle){
  const act=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.act:null;
  document.body.classList.toggle('home-view',S.view==='home');
  app.innerHTML=S.view==='home'?vHome():S.view==='done'?vDone():vWizard();
  if(focusTitle){const t=document.getElementById('stepTitle');if(t)t.focus({preventScroll:true});window.scrollTo({top:0})}
  else if(act){const el=app.querySelector(`[data-act="${act}"]`);if(el&&!el.disabled)el.focus({preventScroll:true})}
}
function copyText(text,btn,sel){
  const fallback=()=>{const el=document.getElementById(sel);if(!el)return;const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{btn.textContent='Disalin ✓'},fallback)}else fallback();
}
function pickDay(ds){
  S.calMsg='';
  if(!S.in||S.out||ds<=S.in){
    if(BOOKED.has(ds)){S.calMsg='Tarikh itu sudah penuh. Sila pilih tarikh lain.';return}
    S.in=ds;S.out=null;
  }else{
    if(conflict(S.in,ds)){S.calMsg='Ada tarikh penuh di antara pilihan anda. Sila pilih tarikh balik yang lebih awal.';return}
    S.out=ds;
  }
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const [a,v]=b.dataset.act.split(':');let focus=false;
  if(a==='start'){S.view='book';S.step=0;S.err='';focus=true}
  if(a==='cal-prev')calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);
  if(a==='cal-next')calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);
  if(a==='day'){pickDay(v);S.err=''}
  if(a==='g-minus')S.guests=Math.max(1,S.guests-1);
  if(a==='g-plus')S.guests=Math.min(20,S.guests+1);
  if(a==='next'){const m=check(STEPS[S.step]);S.err=m;if(!m){S.step++;S.calMsg='';focus=true}}
  if(a==='back'){S.err='';focus=true;if(S.step===0)S.view='home';else S.step--}
  if(a==='send'){setTimeout(()=>{S.view='done';render(true)},300);return}
  if(a==='reset'){Object.assign(S,{view:'home',step:0,in:null,out:null,guests:2,name:'',phone:'',note:'',err:'',calMsg:''});focus=true}
  if(a==='copy-num'){copyText(WA_SHOW.replace(/\D/g,''),b,'wa-num');return}
  if(a==='copy-msg'){copyText(bookingText(),b,'msg');return}
  render(focus);
});
app.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='f-name')S.name=e.target.value;
  if(id==='f-phone')S.phone=e.target.value;
  if(id==='f-note')S.note=e.target.value;
});
render();
</script>
